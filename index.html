<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d2d2d">
  <title>Visibility — ClickGUI preview</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #111116; color: #aaa; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111116; }
    main { width: min(100% - 24px, 760px); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: #aaa; font: 12px Arial, sans-serif; }
    .toolbar p { margin: 0; }
    .upload { display: inline-block; padding: 7px 10px; border: 1px solid #49424d; border-radius: 4px; background: #1b191e; color: #ddd; cursor: pointer; }
    .upload:hover { border-color: #640a64; }
    #java-file { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); clip-path: inset(50%); }
    #status { min-height: 14px; margin: 0 0 10px; color: #888; font: 11px Arial, sans-serif; }
    .stage { min-height: 280px; display: grid; place-items: center; overflow: hidden; background: #151419; border: 1px solid #28252c; }
    /* Clickgui.java: a 300 x 200 body, with its 10px title/drag strip above it. */
    .gui { position: relative; flex: none; width: 300px; height: 200px; margin-top: 10px; background: #2d2d2d; user-select: none; font: 10px Arial, Helvetica, sans-serif; color: #aaa; }
    .dragbar { position: absolute; z-index: 1; left: 0; right: 0; top: -10px; height: 10px; background: #640a64; cursor: grab; }
    .dragbar:active { cursor: grabbing; }
    .category-list, .module-list { position: absolute; top: 1px; display: grid; grid-auto-rows: 15px; gap: 0; margin: 0; padding: 0; }
    .category-list { left: 0; width: 60px; }
    .module-list { left: 65px; width: 60px; }
    .item { display: block; width: 100%; height: 14px; margin: 0; padding: 0 2px; overflow: hidden; border: 0; border-radius: 0; background: #1c1c1c; color: #aaa; text-align: left; white-space: nowrap; font: 10px/14px Arial, Helvetica, sans-serif; cursor: pointer; }
    .item:hover { color: #fff; }
    .item.selected, .item.enabled { background: #e60ae6; color: #aaa; }
    .settings { position: absolute; top: 0; left: 205px; width: 90px; margin: 0; padding: 0; }
    .setting-check, .setting-combo { min-height: 10px; border: 0; padding: 0; background: #1e1e1e; color: #c8c8c8; text-align: left; font: 9px Arial, sans-serif; cursor: pointer; }
    .setting-check { position: absolute; left: 0; top: 3px; display: flex; align-items: center; gap: 5px; background: transparent; }
    .checkmark { width: 10px; height: 10px; flex: none; background: #1e1e1e; }
    .setting-check[aria-checked="true"] .checkmark { background: #e60ae6; }
    .setting-combo { position: absolute; left: 0; top: 3px; width: 70px; height: 10px; overflow: hidden; white-space: nowrap; }
    .slider-setting { position: absolute; left: 0; top: 3px; width: 90px; height: 25px; color: #eee; }
    .slider-label { height: 10px; line-height: 10px; }
    .slider-track { height: 10px; background: #8a068a; cursor: ew-resize; }
    .slider-fill { height: 100%; background: #e60ae6; pointer-events: none; }
    .empty-note { position: absolute; left: 205px; top: 3px; width: 90px; color: #aaa; font-size: 9px; }
    @media (max-width: 420px) { .stage { min-height: 250px; } .gui { transform: scale(.88); } }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <p>ClickGUI · browser preview</p>
      <label class="upload" for="java-file">Drop Java file or choose…</label>
      <input id="java-file" type="file" accept=".java,text/x-java,text/plain">
    </div>
    <p id="status" role="status" aria-live="polite">Preview uses the GUI dimensions, coordinates, and colors from Clickgui.java. Category/module lists are examples because their source data is not in this repository.</p>
    <section class="stage" id="stage" aria-label="ClickGUI preview">
      <div class="gui" id="gui">
        <div class="dragbar" id="dragbar" title="Drag to move the menu"></div>
        <nav class="category-list" id="categories" aria-label="Categories"></nav>
        <section class="module-list" id="modules" aria-label="Modules"></section>
        <section class="settings" id="settings" aria-label="Module settings"></section>
      </div>
    </section>
  </main>
  <script>
    // These are illustrative only: Clickgui.java obtains both lists from other runtime classes.
    const exampleCategories = {
      Combat: ['KillAura', 'Velocity', 'AutoClicker', 'Reach', 'Criticals', 'AntiBot'],
      Movement: ['Speed', 'Fly', 'Sprint', 'Step', 'LongJump', 'NoSlow'],
      Player: ['FastPlace', 'NoFall', 'SafeWalk', 'InventoryMove'],
      Render: ['ESP', 'NameTags', 'Fullbright', 'Tracers'],
      World: ['Scaffold', 'ChestStealer', 'FastMine'],
      Misc: ['HackerDetector', 'Disabler', 'Notifications']
    };
    let categoryData = structuredClone(exampleCategories);
    let selectedCategory = 'Combat';
    const enabled = new Set(['KillAura', 'Sprint']);
    const categories = document.getElementById('categories');
    const modules = document.getElementById('modules');
    const settings = document.getElementById('settings');
    const gui = document.getElementById('gui');
    const stage = document.getElementById('stage');
    let drag = null;

    function render() {
      categories.replaceChildren();
      Object.keys(categoryData).forEach(name => {
        const button = document.createElement('button');
        button.className = `item${name === selectedCategory ? ' selected' : ''}`;
        button.textContent = name;
        button.addEventListener('click', () => { selectedCategory = name; render(); });
        categories.append(button);
      });
      modules.replaceChildren();
      (categoryData[selectedCategory] || []).forEach(name => {
        const button = document.createElement('button');
        button.className = `item${enabled.has(name) ? ' enabled' : ''}`;
        button.textContent = name;
        button.title = 'Left-click to toggle; right-click to show example settings';
        button.addEventListener('click', () => { enabled.has(name) ? enabled.delete(name) : enabled.add(name); render(); });
        button.addEventListener('contextmenu', event => { event.preventDefault(); showExampleSettings(); });
        modules.append(button);
      });
    }
    function showExampleSettings() {
      settings.replaceChildren();
      const checkbox = document.createElement('button');
      checkbox.className = 'setting-check';
      checkbox.setAttribute('role', 'checkbox');
      checkbox.setAttribute('aria-checked', 'true');
      checkbox.innerHTML = '<span class="checkmark"></span><span>Example</span>';
      checkbox.addEventListener('click', () => checkbox.setAttribute('aria-checked', checkbox.getAttribute('aria-checked') !== 'true'));
      const combo = document.createElement('button');
      combo.className = 'setting-combo';
      combo.textContent = 'Mode: Single';
      combo.addEventListener('click', () => { combo.textContent = combo.textContent.endsWith('Single') ? 'Mode: Switch' : 'Mode: Single'; });
      settings.append(checkbox, combo);
      const slider = document.createElement('div');
      slider.className = 'slider-setting';
      slider.innerHTML = '<div class="slider-label">Range: 3.2</div><div class="slider-track"><div class="slider-fill" style="width:44%"></div></div>';
      settings.append(slider);
    }

    // Java source is treated as plain text, never executed. Clickgui.java alone cannot provide
    // module/settings runtime data; if a Category enum is pasted into it, those names are usable.
    function loadJava(file) {
      const status = document.getElementById('status');
      if (!file || !file.name.toLowerCase().endsWith('.java')) { status.textContent = 'Choose a .java source file.'; return; }
      if (file.size > 1024 * 1024) { status.textContent = 'File exceeds the 1 MB preview limit.'; return; }
      const reader = new FileReader();
      reader.onerror = () => { status.textContent = 'Could not read that file.'; };
      reader.onload = () => {
        const source = String(reader.result || '');
        const enumMatch = source.match(/enum\s+Category\s*\{([\s\S]*?)\}/);
        if (enumMatch) {
          const names = enumMatch[1].split(/[;,]/)[0].split(',').map(part => part.trim().replace(/\s*=.*$/, '')).filter(name => /^[A-Za-z_$][\w$]*$/.test(name));
          if (names.length) {
            categoryData = Object.fromEntries(names.map(name => [name, exampleCategories[name] || ['ExampleModule']]));
            selectedCategory = names.includes('Combat') ? 'Combat' : names[0];
          }
        } else {
          categoryData = structuredClone(exampleCategories);
          selectedCategory = 'Combat';
        }
        // Match literal RGB constants when supplied; the project's main source uses these values.
        const colors = [...source.matchAll(/new\s+Color\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)/g)].map(match => match.slice(1, 4).map(Number));
        if (colors.length) {
          const selected = colors.find(c => c[0] > 150 && c[2] > 100) || colors[0];
          if (selected.every(value => value <= 255)) document.documentElement.style.setProperty('--unused-accent', `rgb(${selected.join(',')})`);
        }
        render();
        status.textContent = `${file.name} loaded locally. Layout matches this repository's Clickgui.java; categories/modules/settings are runtime data and cannot be recovered from this file alone.`;
      };
      reader.readAsText(file);
    }
    const input = document.getElementById('java-file');
    input.addEventListener('change', () => loadJava(input.files[0]));
    stage.addEventListener('dragover', event => { event.preventDefault(); });
    stage.addEventListener('drop', event => { event.preventDefault(); loadJava(event.dataTransfer.files[0]); });
    render();

    const bar = document.getElementById('dragbar');
    bar.addEventListener('pointerdown', event => {
      const box = gui.getBoundingClientRect();
      const parent = stage.getBoundingClientRect();
      gui.style.position = 'absolute';
      gui.style.margin = '0';
      gui.style.left = `${box.left - parent.left}px`;
      gui.style.top = `${box.top - parent.top}px`;
      drag = { x: event.clientX - box.left, y: event.clientY - box.top };
      bar.setPointerCapture(event.pointerId);
    });
    bar.addEventListener('pointermove', event => {
      if (!drag || !bar.hasPointerCapture(event.pointerId)) return;
      const bounds = stage.getBoundingClientRect();
      gui.style.left = `${Math.max(0, Math.min(bounds.width - gui.offsetWidth, event.clientX - bounds.left - drag.x))}px`;
      gui.style.top = `${Math.max(10, Math.min(bounds.height - gui.offsetHeight, event.clientY - bounds.top - drag.y))}px`;
    });
    bar.addEventListener('pointerup', () => { drag = null; });
    bar.addEventListener('pointercancel', () => { drag = null; });
  </script>
</body>
</html>
