<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2d2d2d">
  <title>Visibility — ClickGUI preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111116;
      color: #eee;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(111, 32, 111, .14), transparent 46%),
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px), #111116;
      background-size: auto, 24px 24px, 24px 24px, auto;
    }
    .preview {
      width: min(100% - 32px, 620px);
      padding: 28px;
      border: 1px solid #29252d;
      border-radius: 12px;
      background: rgba(22, 21, 26, .94);
      box-shadow: 0 24px 80px #0008;
    }
    .intro { margin: 0 0 22px; }
    .eyebrow {
      margin: 0 0 7px;
      color: #e60ae6;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 23px; letter-spacing: -.035em; }
    .intro p:last-child { margin: 7px 0 0; color: #98939d; font-size: 13px; }
    .stage {
      min-height: 280px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #302c35;
      border-radius: 8px;
      background: radial-gradient(ellipse, #26212a 0, #19171c 70%);
    }
    .gui {
      position: relative;
      width: 300px;
      height: 200px;
      flex: none;
      background: #2d2d2d;
      box-shadow: 0 12px 40px #0009;
      user-select: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      color: #aaa;
      transform-origin: center;
    }
    .dragbar { position: absolute; inset: -10px 0 auto; height: 10px; background: #640a64; cursor: grab; }
    .dragbar:active { cursor: grabbing; }
    .category-list, .module-list { position: absolute; top: 1px; display: grid; grid-auto-rows: 15px; gap: 0; }
    .category-list { left: 0; width: 60px; }
    .module-list { left: 65px; width: 60px; }
    .item {
      display: block;
      width: 100%;
      height: 14px;
      padding: 0 2px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #1c1c1c;
      color: #aaa;
      text-align: left;
      white-space: nowrap;
      font: inherit;
      line-height: 14px;
      cursor: pointer;
    }
    .item:hover { color: #fff; background: #383038; }
    .item.selected, .item.enabled { background: #e60ae6; color: #eee; }
    .item.enabled:hover, .item.selected:hover { background: #f22cf2; }
    .settings {
      position: absolute;
      top: 3px;
      left: 205px;
      width: 90px;
      display: grid;
      gap: 2px;
    }
    .setting-check, .setting-combo {
      min-height: 10px;
      border: 0;
      padding: 0 2px;
      background: #1e1e1e;
      color: #c8c8c8;
      text-align: left;
      font: inherit;
      font-size: 9px;
      cursor: pointer;
    }
    .setting-check { display: flex; align-items: center; gap: 5px; background: transparent; }
    .checkmark { width: 10px; height: 10px; flex: none; background: #1e1e1e; }
    .setting-check[aria-checked="true"] .checkmark { background: #e60ae6; }
    .setting-combo { height: 10px; overflow: hidden; white-space: nowrap; }
    .setting-combo:hover { background: #333; }
    .slider-setting { min-height: 25px; color: #eee; }
    .slider-label { height: 10px; line-height: 10px; }
    .slider-track { height: 10px; background: #8a068a; cursor: ew-resize; }
    .slider-fill { height: 100%; background: #e60ae6; pointer-events: none; }
    .hint {
      display: flex;
      justify-content: center;
      gap: 17px;
      flex-wrap: wrap;
      padding: 13px 4px 0;
      color: #8e8993;
      font-size: 11px;
    }
    kbd { padding: 2px 5px; border: 1px solid #403a44; border-radius: 4px; background: #211f25; color: #d3ced8; font: inherit; }
    .footer { margin: 16px 0 0; color: #77727c; font-size: 11px; text-align: center; }
    @media (max-width: 420px) {
      .preview { width: calc(100% - 20px); padding: 18px 10px; }
      .stage { min-height: 250px; }
      .gui { transform: scale(.88); }
    }
  </style>
</head>
<body>
  <main class="preview">
    <header class="intro">
      <p class="eyebrow">Visibility · browser demo</p>
      <h1>ClickGUI preview</h1>
      <p>A small, interactive recreation of the flat purple-and-charcoal Minecraft menu.</p>
    </header>
    <section class="stage" aria-label="Interactive ClickGUI preview">
      <div class="gui" id="gui">
        <div class="dragbar" id="dragbar" title="Drag to move the menu"></div>
        <nav class="category-list" id="categories" aria-label="Categories"></nav>
        <section class="module-list" id="modules" aria-label="Modules"></section>
        <section class="settings" id="settings" aria-label="Module settings"></section>
      </div>
    </section>
    <div class="hint"><span><kbd>Click</kbd> toggle module</span><span><kbd>Right-click</kbd> settings</span><span><kbd>Drag</kbd> purple bar</span></div>
    <p class="footer">Standalone preview · no Minecraft or build tools required</p>
  </main>
  <script>
    // Representative demo data; the Java GUI populates these lists from the mod's module manager.
    const modulesByCategory = {
      Combat: ['KillAura', 'Velocity', 'AutoClicker', 'Reach', 'Criticals', 'AntiBot'],
      Movement: ['Speed', 'Fly', 'Sprint', 'Step', 'LongJump', 'NoSlow'],
      Player: ['FastPlace', 'NoFall', 'SafeWalk', 'InventoryMove'],
      Render: ['ESP', 'NameTags', 'Fullbright', 'Tracers'],
      World: ['Scaffold', 'ChestStealer', 'FastMine'],
      Misc: ['HackerDetector', 'Disabler', 'Notifications']
    };
    const categories = document.getElementById('categories');
    const modules = document.getElementById('modules');
    const settings = document.getElementById('settings');
    let selectedCategory = 'Combat';
    let openModule = 'KillAura';
    const enabled = new Set(['KillAura', 'Sprint']);
    const values = { 'Auto Block': true, 'Mode': 'Single', 'Range': 3.2, 'APS': 12 };
    const options = ['Single', 'Switch', 'Multi'];

    function renderCategories() {
      categories.replaceChildren();
      Object.keys(modulesByCategory).forEach(name => {
        const button = document.createElement('button');
        button.className = `item${name === selectedCategory ? ' selected' : ''}`;
        button.textContent = name;
        button.setAttribute('aria-pressed', String(name === selectedCategory));
        button.addEventListener('click', () => { selectedCategory = name; render(); });
        categories.append(button);
      });
    }
    function renderModules() {
      modules.replaceChildren();
      modulesByCategory[selectedCategory].forEach(name => {
        const button = document.createElement('button');
        button.className = `item${enabled.has(name) ? ' enabled' : ''}`;
        button.textContent = name;
        button.title = `${name} — click to toggle, right-click for settings`;
        button.addEventListener('click', () => {
          enabled.has(name) ? enabled.delete(name) : enabled.add(name);
          renderModules();
        });
        button.addEventListener('contextmenu', event => {
          event.preventDefault();
          openModule = name;
          renderSettings();
        });
        modules.append(button);
      });
    }
    function renderSettings() {
      settings.replaceChildren();
      if (!openModule) return;
      const checkbox = document.createElement('button');
      checkbox.className = 'setting-check';
      checkbox.setAttribute('role', 'checkbox');
      checkbox.setAttribute('aria-checked', String(values['Auto Block']));
      checkbox.innerHTML = '<span class="checkmark"></span><span>Auto Block</span>';
      checkbox.addEventListener('click', () => { values['Auto Block'] = !values['Auto Block']; renderSettings(); });
      settings.append(checkbox);

      const combo = document.createElement('button');
      combo.className = 'setting-combo';
      combo.textContent = `Mode: ${values.Mode}  ›`;
      combo.title = 'Click to cycle options';
      combo.addEventListener('click', () => {
        values.Mode = options[(options.indexOf(values.Mode) + 1) % options.length];
        renderSettings();
      });
      settings.append(combo);

      [['Range', 1, 6, 0.1], ['APS', 1, 20, 1]].forEach(([name, min, max, step]) => {
        const wrap = document.createElement('div');
        wrap.className = 'slider-setting';
        const label = document.createElement('div');
        label.className = 'slider-label';
        label.textContent = `${name}: ${Number(values[name]).toFixed(name === 'Range' ? 1 : 0)}`;
        const track = document.createElement('div');
        track.className = 'slider-track';
        track.setAttribute('role', 'slider');
        track.setAttribute('aria-label', name);
        track.setAttribute('aria-valuemin', min);
        track.setAttribute('aria-valuemax', max);
        track.setAttribute('aria-valuenow', values[name]);
        const fill = document.createElement('div');
        fill.className = 'slider-fill';
        fill.style.width = `${((values[name] - min) / (max - min)) * 100}%`;
        track.append(fill);
        const update = event => {
          const rect = track.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          values[name] = Math.round((min + ratio * (max - min)) / step) * step;
          renderSettings();
        };
        track.addEventListener('pointerdown', event => { track.setPointerCapture(event.pointerId); update(event); });
        track.addEventListener('pointermove', event => { if (track.hasPointerCapture(event.pointerId)) update(event); });
        wrap.append(label, track);
        settings.append(wrap);
      });
    }
    function render() { renderCategories(); renderModules(); renderSettings(); }
    render();

    const gui = document.getElementById('gui');
    const dragbar = document.getElementById('dragbar');
    let drag = null;
    dragbar.addEventListener('pointerdown', event => {
      drag = { x: event.clientX - gui.offsetLeft, y: event.clientY - gui.offsetTop };
      dragbar.setPointerCapture(event.pointerId);
    });
    dragbar.addEventListener('pointermove', event => {
      if (!drag || !dragbar.hasPointerCapture(event.pointerId)) return;
      const stage = gui.parentElement;
      const bounds = stage.getBoundingClientRect();
      const maxX = Math.max(0, bounds.width - gui.offsetWidth);
      const maxY = Math.max(0, bounds.height - gui.offsetHeight);
      gui.style.position = 'absolute';
      gui.style.left = `${Math.max(0, Math.min(maxX, event.clientX - bounds.left - drag.x))}px`;
      gui.style.top = `${Math.max(10, Math.min(maxY, event.clientY - bounds.top - drag.y))}px`;
    });
    dragbar.addEventListener('pointerup', () => { drag = null; });
  </script>
</body>
</html>
